# Dependency translation table. Each entry lists the package that provides the
# same thing on every family; the first name in a list is the canonical one for
# that family. `sonames` lets us map rpm-style `libfoo.so.1()(64bit)` requirements.
# An entry with no `arch`/`fedora`/`debian` key means "we know this exists but
# there is no package for it on that family".

# Names every desktop system already has; never declared as dependencies.
base = [
  "libc6", "libc-bin", "glibc", "bash", "dpkg", "coreutils", "sed", "grep", "perl-base",
  "adduser", "init-system-helpers", "debconf", "procps", "systemd", "util-linux", "findutils",
  "filesystem", "setup", "ld-linux-x86-64.so.2", "libc.so.6", "libm.so.6", "libpthread.so.0",
  "libdl.so.2", "librt.so.1", "libresolv.so.2", "rtld(GNU_HASH)", "/bin/sh", "/bin/bash",
  "/usr/bin/env", "/usr/bin/sh", "/usr/bin/bash", "libgcc-s1", "libgcc1", "libgcc_s.so.1", "libgcc",
]

