name: Release ZLauncher (Windows + Linux + macOS)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  COREPACK_ENABLE_AUTO_PIN: "0"
  COREPACK_ENABLE_STRICT: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ZL_GITHUB_CLIENT_ID: ${{ secrets.ZL_GITHUB_CLIENT_ID }}

jobs:
  check-secrets:
    name: Signing key present
    runs-on: ubuntu-24.04
    steps:
      - name: Check the updater key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing. Without it no update can be signed, and installed launchers would never accept the update."
            exit 1
          fi

  build-windows:
    name: Windows x64 (NSIS + MSI)
    needs: check-secrets
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: windows-x64

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Rust tests (on real Windows)
        run: cargo test --workspace --locked

      - name: Build installers (signed for the updater)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis,msi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Linux x86_64 (.deb + .rpm + AppImage)
    needs: check-secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl wget file patchelf rpm perl \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: linux-x64

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Build packages (signed for the updater)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles deb,rpm,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/deb/*.deb.sig
            target/release/bundle/rpm/*.rpm
            target/release/bundle/rpm/*.rpm.sig
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: macOS (${{ matrix.arch }})
    needs: check-secrets
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: macos-${{ matrix.arch }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rust tests
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo test --workspace --locked

      - name: Build .dmg and update archive (signed for the updater)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles app,dmg --target ${{ matrix.target }}

      - name: Name the update archive by version and architecture
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          dir=target/${{ matrix.target }}/release/bundle/macos
          mkdir -p out
          cp "$dir/ZLauncher.app.tar.gz" "out/ZLauncher_${version}_${{ matrix.arch }}.app.tar.gz"
          cp "$dir/ZLauncher.app.tar.gz.sig" "out/ZLauncher_${version}_${{ matrix.arch }}.app.tar.gz.sig"
          cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg out/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Draft release with every file
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect files and checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
          (cd release && sha256sum $(ls | grep -v '\.sig$') > SHA256SUMS)
          ls -lah release/
          cat release/SHA256SUMS


      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          tag="v${version}"
          state=$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          if [ "$state" = "false" ]; then
            echo "::error::Release $tag is already published. Raise the version in tauri.conf.json and Cargo.toml first."
            exit 1
          fi
          if [ "$state" = "missing" ]; then
            gh release create "$tag" --draft --target "${{ github.sha }}" --title "ZLauncher ${version}" \
              --notes "Built from ${{ github.sha }}. Write the release notes here; they become the What's new text of the update."
          fi
          gh release upload "$tag" release/* --clobber
          echo "Draft release $tag is ready: $(gh release view "$tag" --json url -q .url)"
