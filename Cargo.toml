[workspace]
resolver = "2"
members = [
    "crates/zl-build",
    "crates/zl-catalog",
    "crates/zl-crawler",
    "crates/zl-download",
    "crates/zl-install",
    "crates/zl-store",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
repository = "https://github.com/TheHolyOneZ/ZLauncher"
homepage = "https://zsync.eu/zlauncher/"
authors = ["TheHolyOneZ <zoryx020@gmail.com>"]
keywords = ["launcher", "installer", "zsync", "tauri", "desktop"]
categories = ["command-line-utilities", "os"]

[workspace.dependencies]
zl-build = { path = "crates/zl-build" }
zl-catalog = { path = "crates/zl-catalog", default-features = false }
zl-crawler = { path = "crates/zl-crawler", default-features = false }
zl-download = { path = "crates/zl-download" }
zl-install = { path = "crates/zl-install" }
zl-store = { path = "crates/zl-store" }

anyhow = "1.0.104"
thiserror = "2.0.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"
directories = "6.0.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
futures = "0.3"
regex = "1"
sha2 = "0.10"
hex = "0.4"
semver = "1"
toml = "1.1.6"
percent-encoding = "2"

reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "http2",
    "charset",
    "system-proxy",
    "gzip",
    "brotli",
    "json",
    "stream",
] }
scraper = "0.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
